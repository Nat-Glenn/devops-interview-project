name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run static analysis
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Compile application
        run: go build ./...

      - name: Build container image
        run: docker build -t task-api:${{ github.sha }} .

  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish container image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy published image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"

          docker pull "$IMAGE"

          docker run -d \
            --name task-api \
            -p 8080:8080 \
            "$IMAGE"

      - name: Wait for healthy deployment
        run: |
          for attempt in {1..12}; do
            STATUS=$(docker inspect task-api --format '{{.State.Health.Status}}')

            if [ "$STATUS" = "healthy" ]; then
              echo "task-api is healthy"
              exit 0
            fi

            echo "Waiting for task-api to become healthy. Current status: $STATUS"
            sleep 5
          done

          echo "task-api did not become healthy"
          docker logs task-api
          exit 1

      - name: Verify health endpoint
        run: curl --fail --silent --show-error http://localhost:8080/healthz

      - name: Clean up deployment
        if: always()
        run: docker rm -f task-api || true

